[project]
name = "frappe_vault"
authors = [
    { name = "lubus", email = "info@lubus.in"}
]
description = "Password and secrets management application"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # AES-256 encrypted ZIP archives for password rotation delivery.
    # stdlib zipfile can only *read* encrypted zips, never write them.
    "pyzipper>=0.4.0",
    "pyotp",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[project.urls]
Homepage = "https://github.com/lubusIN/frappe-vault"
Repository = "https://github.com/lubusIN/frappe-vault.git"
"Bug Reports" = "https://github.com/lubusIN/frappe-vault/issues"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",  # line too long
    "W191",  # indentation contains tabs (standard for Frappe)
    "W293",  # blank line contains whitespace
]
